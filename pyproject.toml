[project]
name = "my-video-generator"
version = "0.1.0"
description = "Script-to-video generator"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest",
    "rake-nltk",
    "ollama",
    "spacy",
    "opencv-python",
    "pygame",
    "moviepy >= 2.0",
    "rembg",
    "numpy",
    "pytest>=9.0.3",
    "fal-client>=1.0.0",
    "num2words>=0.5",
    "pydub>=0.25",
    "onnxruntime",
    "audioop-lts<1.0; python_version >= '3.13'",
    "faster-whisper>=1.0",
    "ultralytics>=8.4.68",
    "click>=8.4.1",
    "manim>=0.20.1",
    "maverick-coref>=1.0.7",

    # 1-visualisable-identification/_theme_engine.py — what a script is
    # ABOUT. Both MIT/BSD-3, both numpy-only.
    "model2vec>=0.9",        # the static embedding KeyBERT scores with
    "scikit-learn>=1.9",     # KeyBERT's vectoriser
    # ...and KeyBERT itself, which is NOT listed here on purpose: it hard-
    # requires sentence-transformers, which drags in a second torch stack we
    # do not want and never call. Install it without its dependencies:
    #     uv pip install keybert --no-deps
    # Missing entirely is fine — _theme_engine degrades to "no theme on any
    # line" and every search term is unchanged.
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
