[project]
name = "my-video-generator"
version = "0.1.0"
description = "Script-to-video generator"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest",
    "rake-nltk",
    "ollama",
    "spacy",
    "opencv-python",
    "pygame",
    "moviepy >= 2.0",
    "rembg",
    "numpy",
    "pytest>=9.0.3",
    "fal-client>=1.0.0",
    "num2words>=0.5",
    "pydub>=0.25",
    "onnxruntime",
    "audioop-lts<1.0; python_version >= '3.13'",
    "faster-whisper>=1.0",
    "ultralytics>=8.4.68",
    "click>=8.4.1",
    "manim>=0.20.1",
    "maverick-coref>=1.0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
